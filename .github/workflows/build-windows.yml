name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Build and verify Windows application
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload Windows download package
        uses: actions/upload-artifact@v4
        with:
          name: MixCut-Windows-x64
          path: |
            dist/MixCut-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
